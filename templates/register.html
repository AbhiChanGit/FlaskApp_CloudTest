{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
  <h1>Create an account</h1>
  <!-- enctype is REQUIRED for file uploads; without it request.files is empty -->
  <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ form.username or '' }}" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>

    <div class="row">
      <div>
        <label for="firstname">First name</label>
        <input id="firstname" name="firstname" value="{{ form.firstname or '' }}" required>
      </div>
      <div>
        <label for="lastname">Last name</label>
        <input id="lastname" name="lastname" value="{{ form.lastname or '' }}" required>
      </div>
    </div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.email or '' }}" required>

    <label for="address">Address</label>
    <textarea id="address" name="address" rows="2" required>{{ form.address or '' }}</textarea>

    <label for="file">Upload a text file (.txt)</label>
    <input id="file" name="file" type="file" accept=".txt">

    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
