<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}User Portal{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3f5f9; color: #1f2937; }
    nav { background: #232f3e; padding: 14px 24px; display: flex; gap: 18px; align-items: center; }
    nav .brand { color: #ff9900; font-weight: 700; margin-right: auto; text-decoration: none; }
    nav a { color: #fff; text-decoration: none; }
    .card { max-width: 480px; margin: 40px auto; background: #fff; padding: 28px 32px;
            border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: .9rem; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    input:focus, textarea:focus { outline: 2px solid #ff9900; border-color: transparent; }
    .row { display: flex; gap: 12px; } .row > div { flex: 1; }
    .btn { display: inline-block; margin-top: 20px; padding: 10px 18px; border: 0; border-radius: 6px;
           background: #ff9900; color: #111; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #e2e8f0; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
    .flash.error { background: #fee2e2; color: #991b1b; }
    .flash.success { background: #dcfce7; color: #166534; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #e5e7eb; }
    th { width: 35%; color: #6b7280; font-weight: 600; }
    .stat { font-size: 2.2rem; font-weight: 800; color: #ff9900; }
    .muted { color: #6b7280; font-size: .9rem; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="{{ url_for('index') }}">User Portal</a>
    {% if session.username %}
      <a href="{{ url_for('profile') }}">Profile</a>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('register') }}">Register</a>
      <a href="{{ url_for('login') }}">Log in</a>
    {% endif %}
  </nav>
  <div class="card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
